name: Publish AgentOS ARM64 image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentos-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/agent-os-inc/open-connector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build tested custom image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.agentos
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify exact digest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/agent-os-inc/open-connector/.github/workflows/publish-docker.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > image-signature.json
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > image-index.json
          jq -e '[.manifests[].platform | select(.os != "unknown")] == [{"architecture":"arm64","os":"linux"}]' image-index.json
          jq -n --arg source "$GITHUB_SHA" --arg image "$IMAGE@$DIGEST" --arg run "$GITHUB_RUN_ID" \
            '{source: $source, image: $image, run: $run, platform: "linux/arm64"}' > image-receipt.json
          cat image-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image receipt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentos-arm64-image-${{ github.sha }}
          path: |
            image-receipt.json
            image-index.json
            image-signature.json
          if-no-files-found: error
